name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend - Java 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven test
        run: mvn -B clean test

  ai-test:
    name: AI Service - Python 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service-python
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service-python/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q

  docker-build:
    name: Docker 镜像构建校验
    needs: [backend-test, ai-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose 配置校验
        run: docker compose config --quiet
      - name: 构建全部镜像
        run: docker compose build
