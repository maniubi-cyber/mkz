spring:
  rabbitmq:
    host: ${mkz.mq.host:192.168.150.101}
    port: ${mkz.mq.port:5672}
    virtual-host: ${mkz.mq.vhost:/mkz}
    username: ${mkz.mq.username:mkz}
    password: ${mkz.mq.password:123321}
    listener:
      simple:
        retry:
          enabled: ${mkz.mq.listener.retry.enable:true} # 开启消费者失败重试
          initial-interval: ${mkz.mq.listener.retry.interval:1000ms} # 初始的失败等待时长为1秒
          multiplier: ${mkz.mq.listener.retry.multiplier:2} # 失败的等待时长倍数，下次等待时长 = multiplier * last-interval
          max-attempts: ${mkz.mq.listener.retry.max-attempts:3} # 最大重试次数
          stateless: ${mkz.mq.listener.retry.stateless:true} # true无状态；false有状态。如果业务中包含事务，这里改为false