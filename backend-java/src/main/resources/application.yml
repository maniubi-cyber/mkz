server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: knowledge-rag-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ==================== Spring Cloud Alibaba Nacos ====================
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER:DEFAULT}
        # 心跳间隔
        heart-beat-interval: 5000
        # 心跳超时时间
        heart-beat-timeout: 15000
        # IP删除超时时间
        ip-delete-timeout: 30000
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        # 配置刷新
        refresh-enabled: true
    # ==================== Spring Cloud Alibaba Sentinel ====================
    sentinel:
      enabled: true
      eager: true  # 立即加载Sentinel
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8081}
        port: 8719
      # 数据源配置（Nacos 持久化规则）
      datasource:
        # 流控规则
        flow:
          nacos:
            server-addr: ${NACOS_SERVER:localhost:8848}
            namespace: ${NACOS_NAMESPACE:public}
            data-id: ${spring.application.name}-flow-rules
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            rule-type: flow
        # 降级规则
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER:localhost:8848}
            namespace: ${NACOS_NAMESPACE:public}
            data-id: ${spring.application.name}-degrade-rules
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            rule-type: degrade
        # 热点参数规则
        param-flow:
          nacos:
            server-addr: ${NACOS_SERVER:localhost:8848}
            namespace: ${NACOS_NAMESPACE:public}
            data-id: ${spring.application.name}-param-rules
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            rule-type: param-flow

  # DataSource Configuration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/knowledge_rag?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:js2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 5000ms
      timeout: 5000ms

  # ==================== Elasticsearch Configuration ====================
    elasticsearch:
      uris: ${ES_URIS:http://localhost:9200}
      username: ${ES_USERNAME:elastic}
      password: ${ES_PASSWORD:}
      connection-timeout: 10s
      socket-timeout: 30s
      # 连接池配置
      max-connect-per-route: 10
      max-connect-total: 30

# ==================== Qdrant Configuration (向量数据库 - 父切块存储) ====================
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  username: ${QDRANT_USER:}
  password: ${QDRANT_PASSWORD:}
  collection-prefix: ${QDRANT_COLLECTION_PREFIX:kb_}
  vector-dim: ${QDRANT_VECTOR_DIM:1024}

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ==================== MyBatis-Plus Configuration ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.rag.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 乐观锁插件配置
      # 使用 @Version 注解自动启用乐观锁
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 自定义线程池配置（CompletableFuture 异步编排） ====================
thread-pool:
  async:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: rag-async-

# ==================== Knife4j Configuration ====================
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ==================== MinIO Configuration ====================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:knowledge-rag}

# ==================== JWT Configuration ====================
jwt:
  secret: ${JWT_SECRET:YOUR_BASE64_ENCODED_SECRET_KEY_MINIMUM_256_BITS_LONG}
  expiration: ${JWT_EXPIRATION:86400000}

# ==================== AI Service Configuration (Python 侧) ====================
# AI/RAG 业务全部由 Python FastAPI 服务实现，Java 通过 OpenFeign 调用
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  # Python 服务 API:
  #   POST /api/parse           - 文档解析（文本提取 → 切片 → 向量化）
  #   POST /api/vectors/delete  - 删除文档向量
  #   POST /api/search          - 向量检索
  #   POST /api/chat            - RAG 问答

# ==================== OpenFeign Configuration ====================
feign:
  client:
    config:
      default:
        # 连接超时
        connect-timeout: 5000
        # 读取超时
        read-timeout: 120000  # AI 解析可能较慢
        # 日志级别
        logger-level: basic
  # 启用 Sentinel 熔断（与 Spring Cloud Alibaba 集成）
  sentinel:
    enabled: true
  # 启用压缩
  compression:
    request:
      enabled: true
    response:
      enabled: true

# ==================== Actuator Configuration ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,sentinel,nacos-discovery,nacos-config
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: true
    redis:
      enabled: true
