server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: knowledge-rag-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # DataSource Configuration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/knowledge_rag?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:js2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 5000ms
      timeout: 5000ms

  # ==================== Elasticsearch Configuration ====================
    elasticsearch:
      uris: ${ES_URIS:http://localhost:9200}
      username: ${ES_USERNAME:elastic}
      password: ${ES_PASSWORD:}
      connection-timeout: 10s
      socket-timeout: 30s
      # 连接池配置
      max-connect-per-route: 10
      max-connect-total: 30

# ==================== Qdrant Configuration (向量数据库 - 由 Python AI Service 管理) ====================
# Qdrant 是生产级向量数据库，由 Python AI Service 内部管理（子块 embedding 存储），
# Java 侧无需直接连接，仅保留配置说明。

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ==================== MyBatis-Plus Configuration ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.rag.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 乐观锁插件配置
      # 使用 @Version 注解自动启用乐观锁
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 自定义线程池配置（CompletableFuture 异步编排） ====================
thread-pool:
  async:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: rag-async-

# ==================== Knife4j Configuration ====================
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ==================== MinIO Configuration ====================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:knowledge-rag}

# ==================== JWT Configuration ====================
jwt:
  secret: ${JWT_SECRET:YOUR_BASE64_ENCODED_SECRET_KEY_MINIMUM_256_BITS_LONG}
  access-token-expire: ${JWT_ACCESS_EXPIRE:7200}
  refresh-token-expire: ${JWT_REFRESH_EXPIRE:604800}

# ==================== AI Service Configuration (Python 侧) ====================
# AI/RAG 业务全部由 Python FastAPI 服务实现，Java 通过 RestTemplate 调用
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  # Python 服务 API:
  #   POST /api/parse           - 文档解析（文本提取 → 切片 → 向量化）
  #   POST /api/vectors/delete  - 删除文档向量
  #   POST /api/search          - 向量检索
  #   POST /api/chat            - RAG 问答

# ==================== Actuator Configuration ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: true
    redis:
      enabled: true
