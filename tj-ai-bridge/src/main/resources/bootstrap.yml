server:
  port: 8095  #桥接服务端口（tj-chat 9999 / Python AI 8094 / 桥接 8095）
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: dev
  application:
    name: ai-bridge-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: #共享配置
          - dataId: shared-spring.yaml
          - dataId: shared-redis.yaml
          - dataId: shared-logs.yaml
          - dataId: shared-feign.yaml
# Python AI 服务地址（FastAPI + LangChain + Chroma）
ai:
  service:
    url: http://localhost:8094
# OpenFeign 超时配置：LLM 推理较慢，读取超时设为 120s
feign:
  client:
    config:
      ai-python-service:
        connect-timeout: 5000
        read-timeout: 120000
